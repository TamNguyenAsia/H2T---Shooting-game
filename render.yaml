# Render Blueprint cho H2T-shooting: 1 web service Node.js, dữ liệu lưu trên Neon PostgreSQL.
# Trên Render: New > Blueprint > chọn repo GitHub này > Render hỏi DATABASE_URL và ADMIN_USERNAMES > Apply.
services:
  - type: web
    name: h2t-shooting
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Chuỗi kết nối Neon (Neon Console > Connect), dạng:
      # postgresql://user:matkhau@ep-xxxx-pooler.ap-southeast-1.aws.neon.tech/neondb?sslmode=require
      # Không ghi giá trị thật vào file này; Render sẽ hỏi khi tạo Blueprint.
      - key: DATABASE_URL
        sync: false
      # Bắt buộc SSL khi kết nối Neon
      - key: PGSSL
        value: "true"
      - key: SESSION_SECRET
        generateValue: true
      # Tên đăng nhập có quyền admin, cách nhau bằng dấu phẩy. Render hỏi giá trị này khi tạo Blueprint.
      - key: ADMIN_USERNAMES
        sync: false
